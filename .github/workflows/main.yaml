name: Build and Release ptree

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/release/ptree dist/ptree-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptree-linux-x86_64
          path: dist/ptree-linux-x86_64

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/release/ptree.exe dist/ptree-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptree-windows-x86_64
          path: dist/ptree-windows-x86_64.exe

  build-macos-x86:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/release/ptree dist/ptree-macos-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptree-macos-x86_64
          path: dist/ptree-macos-x86_64

  build-macos-arm:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp target/release/ptree dist/ptree-macos-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ptree-macos-aarch64
          path: dist/ptree-macos-aarch64

  release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-macos-x86
      - build-macos-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[0].version')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ptree-linux-x86_64
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ptree-windows-x86_64
          path: artifacts

      - name: Download macOS x86 artifact
        uses: actions/download-artifact@v4
        with:
          name: ptree-macos-x86_64
          path: artifacts

      - name: Download macOS ARM artifact
        uses: actions/download-artifact@v4
        with:
          name: ptree-macos-aarch64
          path: artifacts

      - name: Create Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "ptree v$VERSION" \
            --generate-notes \
            artifacts/*
